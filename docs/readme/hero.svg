<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="410" viewBox="0 0 1200 410"
     role="img" aria-labelledby="title desc">
  <title id="title">IPC Uploader</title>
  <desc id="desc">IPC Uploader: one form that packages calculation reports for Wiecon's hourly AI proof check and brings the finished checks back. On the right, the zip package the agent receives (the report PDFs, a drawing, Codes_to_check.md and Project.txt) and its path from the Inbox through the hourly AI check to the Outbox.</desc>

  <defs>
    <!-- the Wiecon heading gradient: navy to 30%, then fading to Wiecon Blue -->
    <linearGradient id="wiecon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00235D"/>
      <stop offset="0.3" stop-color="#00235D"/>
      <stop offset="1" stop-color="#0072BC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="410" rx="24" fill="url(#wiecon)"/>

  <!-- motif: a cable-stayed pylon, like the cables in the Wiecon logo -->
  <g id="cable-motif" stroke="#A9D0ED" fill="none" stroke-linecap="round">
    <g stroke-width="2" opacity="0.18">
      <path d="M628 70 L110 378"/>
      <path d="M628 70 L240 378"/>
      <path d="M628 70 L370 378"/>
      <path d="M628 70 L500 378"/>
      <path d="M628 70 L756 378"/>
      <path d="M628 70 L886 378"/>
      <path d="M628 70 L1016 378"/>
      <path d="M628 70 L1146 378"/>
    </g>
    <path d="M628 56 L628 378" stroke-width="6" opacity="0.32"/>
    <path d="M40 378 L1160 378" stroke-width="4" opacity="0.35"/>
  </g>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" letter-spacing="2" fill="#A9D0ED">WIECON · INDEPENDENT PROOF CHECK</text>
    <text x="0" y="170" font-size="68" font-weight="700" fill="#FFFFFF">IPC Uploader</text>
    <g font-size="24" fill="#FFFFFF" opacity="0.92">
      <text x="0" y="218">One form that packages calculation</text>
      <text x="0" y="250">reports for the hourly AI proof check,</text>
      <text x="0" y="282">and brings the finished checks back.</text>
    </g>
    <text x="0" y="338" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#A9D0ED">v3.0.0 · Python 3.14 · NiceGUI · FastAPI</text>
  </g>

  <!-- proof: the package the agent actually receives -->
  <g id="zip-package" transform="translate(676 48)">
    <rect width="472" height="228" rx="16" fill="#FFFFFF"/>
    <path d="M0 16 Q0 0 16 0 H456 Q472 0 472 16 V52 H0 Z" fill="#E6F0F9"/>
    <!-- zip icon -->
    <g transform="translate(22 13)">
      <rect width="22" height="27" rx="3" fill="none" stroke="#00235D" stroke-width="2"/>
      <path d="M11 2 V6 M11 9 V12 M11 15 V18" stroke="#00235D" stroke-width="3"/>
      <rect x="7.5" y="18" width="7" height="6" rx="1.5" fill="#00235D"/>
    </g>
    <text x="58" y="33" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" font-weight="600" fill="#00235D">Alex Chen_check_for_IRC_….zip</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18">
      <text x="24" y="88" fill="#1F2937"><tspan fill="#9CA3AF">├─ </tspan>Pier P3 Design Calculation.pdf</text>
      <text x="24" y="116" fill="#1F2937"><tspan fill="#9CA3AF">├─ </tspan>Pile Cap PC3 Design Calculation.pdf</text>
      <text x="24" y="144" fill="#1F2937"><tspan fill="#9CA3AF">├─ </tspan>General Arrangement Drawing.pdf</text>
      <text x="24" y="172" fill="#0072BC"><tspan fill="#9CA3AF">├─ </tspan>Codes_to_check.md</text>
      <text x="24" y="200" fill="#0072BC"><tspan fill="#9CA3AF">└─ </tspan>Project.txt</text>
    </g>
  </g>

  <!-- process cue: where the package goes -->
  <g id="flow" transform="translate(676 296)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    <rect x="0" y="0" width="90" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#A9D0ED" stroke-width="1.5"/>
    <text x="45" y="26" text-anchor="middle" fill="#FFFFFF">Inbox</text>

    <path d="M100 20 H124 M118 14 L125 20 L118 26" stroke="#A9D0ED" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="134" y="0" width="186" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#A9D0ED" stroke-width="1.5"/>
    <text x="227" y="26" text-anchor="middle" fill="#FFFFFF">AI check · hourly</text>

    <path d="M330 20 H354 M348 14 L355 20 L348 26" stroke="#A9D0ED" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="364" y="0" width="108" height="40" rx="20" fill="#15803D"/>
    <text x="398" y="26" text-anchor="middle" fill="#FFFFFF">Outbox</text>
    <path d="M440 20 L446 26 L457 14" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
